[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
botchain = "https://rpc.botchain.ai"

[etherscan]
botchain = { key = "${BOTSCAN_API_KEY}", url = "https://scan.botchain.ai/api" }
